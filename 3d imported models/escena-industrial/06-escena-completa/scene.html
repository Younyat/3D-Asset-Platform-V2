<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escena industrial completa · seis objetos independientes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141517; color: #e9e6e1;
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 316px; height: 100%; }
  #view { position: relative; background: #eceae6; }
  #view canvas { display: block; }
  #hud { position: absolute; left: 20px; top: 18px; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #6d6a64; }
  #hud b { color: #17181a; font-weight: 600; }
  #panel { overflow-y: auto; padding: 20px 18px 40px; background: #1a1b1e;
    border-left: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 20px; }
  h2 { margin: 0 0 10px; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase;
    color: #8c8781; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 7px; }
  button { font: inherit; font-size: 12px; cursor: pointer; color: #e9e6e1;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px; padding: 8px 11px; text-align: left; }
  button:hover { background: rgba(255,255,255,0.13); }
  button.on { background: #d9520c; border-color: #d9520c; }
  .slot { border: 1px solid rgba(255,255,255,0.09); border-radius: 9px; padding: 9px 10px;
    display: flex; flex-direction: column; gap: 7px; }
  .slot.off { opacity: 0.45; }
  .slot-head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .slot-head .nm { flex: 1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4bae4f; flex: none; }
  .slot.off .dot { background: #6d6a64; }
  button.toggle { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
  select { font: inherit; font-size: 11.5px; width: 100%; padding: 5px 7px; border-radius: 6px;
    color: #e9e6e1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
  .row { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; }
  .row label { display: flex; justify-content: space-between; color: #c9c4bd; }
  .row label span { color: #8c8781; font-family: 'IBM Plex Mono', monospace; }
  input[type=range] { width: 100%; accent-color: #d9520c; }
  #log { font-family: 'IBM Plex Mono', monospace; font-size: 10px; line-height: 1.75;
    background: #101114; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
    padding: 9px 10px; color: #8c8781; max-height: 190px; overflow-y: auto; }
  #log b { color: #e8b400; font-weight: 500; }
  .hint { font-size: 10.5px; line-height: 1.6; color: #6d6a64; margin: 0; }
  a { color: #e8b400; text-decoration: none; font-size: 11.5px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <div id="view"><div id="hud"><b>Escena industrial</b> · ciclo <span id="clock">0,0 s</span></div></div>
  <aside id="panel">
    <div>
      <h2>Ciclo maestro · 12 s</h2>
      <div class="stack">
        <button id="play" type="button" class="on">Pausar ciclo</button>
        <button id="restart" type="button">Reiniciar</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label>Velocidad<span id="speedv">1.00×</span></label>
        <input id="speed" type="range" min="10" max="250" value="100">
      </div>
    </div>

    <div>
      <h2>Objetos de la escena</h2>
      <div class="stack" id="slots"></div>
      <p class="hint" style="margin-top:9px">Quita, repón o sustituye cualquier objeto en vivo.
        La escena sigue funcionando: cada modelo cumple el mismo contrato.</p>
    </div>

    <div>
      <h2>Señales</h2>
      <div id="log"></div>
      <div class="stack" style="margin-top:8px">
        <button id="diag" type="button">diagnose() de todos los objetos</button>
      </div>
    </div>

    <a href="../docs/GUIA-INTEGRACION.html">Guía de integración →</a>
  </aside>
</div>
<script type="module" src="./scene-boot.js"></script>
</body>
</html>
